name: Portfolio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: portfolio-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Python 3.12
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: '3.12'
      - name: Dependencies and Chromium
        run: |
          npm ci --cache work/npm-cache
          npx playwright install --with-deps chromium
      - name: Isolated PG, package, frontend and container acceptance
        run: |
          chromium_path="$(node --input-type=module -e 'import { chromium } from "@playwright/test"; process.stdout.write(chromium.executablePath())')"
          python scripts/run_ci.py verify --output work/ci --chromium "$chromium_path"
      - name: Clean only registered disposable scopes
        if: always()
        run: python scripts/run_ci.py cleanup --output work/ci
      - name: Safe verification summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/ci/evidence/summary.json
          if-no-files-found: warn
          retention-days: 7
