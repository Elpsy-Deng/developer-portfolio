services:
  postgres:
    image: ${PORTFOLIO_PG_IMAGE:-postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24}
    labels:
      dev.jackteng.portfolio.scope: ${COMPOSE_PROJECT_NAME:?Own scope required}
    environment:
      POSTGRES_DB: ${PORTFOLIO_DATABASE:?Dedicated database required}
      POSTGRES_USER: portfolio_bootstrap
      POSTGRES_PASSWORD: ${PORTFOLIO_BOOTSTRAP_PASSWORD:?Private bootstrap password required}
    ports: ['127.0.0.1:${PORTFOLIO_PG_PORT:?Own loopback port required}:5432']
    volumes: [portfolio-pg:/var/lib/postgresql/data]
    mem_limit: 256m
    cpus: 1.0
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U portfolio_bootstrap -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  portfolio-pg:
