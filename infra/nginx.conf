pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format private '$request_method $status $upstream_status';
    access_log /dev/stdout private;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 8080;
        server_name _;
        absolute_redirect off;
        root /usr/share/nginx/html;
        client_max_body_size 6m;
        add_header X-Content-Type-Options nosniff always;
        location = /healthz { access_log off; return 200 'gateway\n'; }
        location ^~ /api/ {
            proxy_pass http://api:19186;
            proxy_set_header Host $http_host;
            proxy_set_header Forwarded '';
            proxy_set_header X-Forwarded-For '';
            proxy_set_header X-Forwarded-Host '';
            proxy_set_header X-Forwarded-Proto '';
            proxy_set_header X-Real-IP '';
            proxy_connect_timeout 2s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
            proxy_next_upstream off;
        }
        location /assets/ { try_files $uri =404; }
        location ~* \.(png|jpe?g|svg|ico|gif|webp)$ { try_files $uri =404; }
        location /projects/ {
            # Public historical images are files; project deep links are SPA routes.
            try_files $uri /index.html;
        }
        location / { try_files $uri $uri/ /index.html; }
    }
}
